<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生成密码哈希</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:420px;margin:40px auto;padding:0 16px;background:#111;color:#eee}
    input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:16px}
    button{background:#ff2d78;border:none;cursor:pointer;font-weight:700}
    code{display:block;word-break:break-all;background:#222;padding:12px;border-radius:8px;margin-top:12px}
  </style>
</head>
<body>
  <h1>密码 → SHA-256</h1>
  <p>生成后复制到 <code>data/site.json</code> 的 <code>passwordHash</code> 字段。</p>
  <input id="pw" type="password" placeholder="输入新密码" />
  <button id="go">生成哈希</button>
  <code id="out">—</code>
  <script>
    document.getElementById('go').onclick = async () => {
      const text = document.getElementById('pw').value;
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
      document.getElementById('out').textContent = hex;
    };
  </script>
</body>
</html>
